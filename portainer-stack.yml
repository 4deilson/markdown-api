services:

  markdown-api:
    # Nome da imagem definido via variavel IMAGE_NAME no portainer-stack.env
    image: ${IMAGE_NAME:-markdown-api:latest}
    container_name: markdown-to-pdf-api
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
      - API_KEY=${API_KEY}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_DISABLE_DEV_SHM_USAGE=true
      - CHROME_BIN=/usr/bin/chromium
      - DISPLAY=:99
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const options = { hostname: 'localhost', port: 7000, path: '/health', timeout: 10000 }; const req = http.request(options, (res) => { if (res.statusCode === 200) { process.exit(0); } else { process.exit(1); } }); req.on('error', () => { process.exit(1); }); req.end();"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    volumes:
      - /tmp:/tmp
    networks:
      - rede-01
    labels:
      - "traefik.enable=false"
      - "portainer.project=markdown-api"

networks:
  rede-01:
    external: true
